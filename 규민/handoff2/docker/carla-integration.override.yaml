# 분리 이유: planning-simulator.pin.yaml은 세션2에서 이미 검증
# 완료(RViz 표시, 2D Pose Estimate/2D Goal Pose/AUTO 주행)된
# 비-CARLA 구성이라 건드리지 않는다. 이 파일은 CARLA 연동 작업을
# 할 때만 pin.yaml과 함께 -f 로 추가로 얹는 CARLA 전용 오버레이다.
#
# network_mode: host 사용 이유: autoware_carla_interface의 host
# 파라미터 기본값이 "localhost:2000"이라, 호스트 네트워크
# 네임스페이스를 그대로 쓰면 이 기본값을 바꾸지 않고도 호스트에서
# 도는 CARLA 서버(2000번 포트)에 닿는다. compose 기본 브리지를
# 쓰면 PC마다 달라지는 게이트웨이 IP를 파라미터로 매번 넘겨야
# 한다. 근거: docs.autoware.org docker-installation의 awsim 데모
# 항목도 동일 이유로 network_mode: host를 씀(2026-09-13 확인).
# 미확정 요소는 docs/session03_report.md에 기록: 이 호스트는
# wlp2s0 등 실제 인터페이스가 여러 개 있어, host 모드에서
# CycloneDDS가 어느 인터페이스를 자동 선택하는지는 다음 세션
# 실행 시 최초 확인 필요.
#
# 마운트 소스 경로: ${HOME}/campus_mobility_sim/.venv-carla/lib/
# python3.10/site-packages (세션2에서 pip install carla==0.9.15로
# 만든 프로젝트 venv, 컨테이너 python도 3.10.12로 동일 확인됨,
# 2026-09-13). 컨테이너 안에는 pip install 하지 않으므로 이미지도
# --rm 컨테이너 생애주기도 건드리지 않는다.
services:
  planning-simulator:
    network_mode: host
    volumes:
      - ${HOME}/campus_mobility_sim/.venv-carla/lib/python3.10/site-packages/carla:/opt/carla-pyclient/carla:ro
      - ${HOME}/campus_mobility_sim/.venv-carla/lib/python3.10/site-packages/carla.libs:/opt/carla-pyclient/carla.libs:ro
    environment:
      - PYTHONPATH=/opt/carla-pyclient
