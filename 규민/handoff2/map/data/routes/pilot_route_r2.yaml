# 노선 파일 2판(세션58, 2026-10-13): 1판(pilot_route_r1.yaml a9ca2108)에서 platforms 참조만 바꿈. 노선·목표·구간 값은 1판과 같다
# 시범 노선(맵세션56b, 2026-10-13): 정문(이쪽) 출발 -> 중문(건너편) 통과 -> 도서관 북문 정차 -> 양성재(이쪽) 종점
# 좌표는 지도 좌표계(xodr 평면 = Autoware map). 승강장 값은 map/data/shuttle_platforms_v31.yaml 의 id 로 찾는다
# 미션 노드: 한 운행 안에서 '요청 없는 정류장 지나가기'(중문)와 '요청 있는 정류장 서기'(북문)를 같이 보인다
#   - 요청 없음: 통과 정류장의 via 를 Autoware 경유점으로 넣고 지나간다
#   - 요청 있음: 그 정류장의 goal 을 목표로 주고 선다(통과 정류장도 정차 가능한 승강장이다)
# 구간 road 열은 참고다. 실제 경로는 Autoware(Lanelet2) 가 다시 계산한다. 같은지 s56b_candidates.py 로 확인했다
# goal 의 문 위치·정차 여유·문 구역·전방 통로는 가정값이다(shuttle_platforms_v31.yaml assumptions, 사용자 결정 2)
# 고른 이유: 최종 시연 노선이 정문 -> 후문이라, 이 노선 뒤에 양성재 -> 후문을 붙이면 최종 노선이 된다(사용자 결정, 세션56c)
