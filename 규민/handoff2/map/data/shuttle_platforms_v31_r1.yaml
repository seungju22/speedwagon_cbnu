  stop_zone_margin_front: 1.0  # I6-2 29쌍 정지 앞뒤 -0.443~-0.469m 의 약 2배
  stop_zone_margin_rear: 1.0
  door_zone_along: 3.0  # 문 폭 1.2 + 양옆 0.9
