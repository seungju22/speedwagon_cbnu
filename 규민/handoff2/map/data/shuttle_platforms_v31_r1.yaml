# 좌표는 지도 좌표계다(xodr 평면 = Autoware map 좌표, 단위 m, 방향 = x 축에서 반시계 도). CARLA 좌표는 (x, -y, -yaw)
# 승강장 자리는 stops_v3.yaml 의 platforms 11곳 그대로다(road/s/lane). 이 파일은 그 위에 셔틀용 값을 더한다
# lanelet_id 는 참고용이다. Lanelet2 지도를 다시 만들면 바뀐다. 위치는 x·y 로 찾는다
# 설명과 가정값 바꾸는 법: map/docs/shuttle_route_file.md
xodr: cbnu_campus_v31_candidate_s54.xodr
xodr_sha256_16: 214507afc87c2523
lanelet2_sha256_16: 83edb7755588184f  # I6-2 지도(s54 + 보정 목록 1317·1825 뺌). 28a57711(세션55 nB)은 r1318·r1188 만 빠지고 그 둘은 승강장 다각형에서 29.0m 이상 떨어져(중문이 가장 가까움) 11곳 값이 같다
# 가정값(사용자 결정 2, 2026-10-13 그대로 씀): 문 위치(vehicle.door), 문 구역(door_zone_*), 전방 통로 8.0m, 정차 여유 앞뒤 1.0m.
#   실제 셔틀 치수가 아니다. 정해지면 s56_shuttle.py 머리를 고쳐 다시 만든다
stops_sha256_16: befb9fddffe112ad  # stops_v3.yaml
vehicle:  # Autoware 1.9.0 이미지 autoware_sample_vehicle_description vehicle_info.param.yaml(sha256 7f3d7661c23a9768)
  wheel_base: 2.79
  front_overhang: 1.0
  rear_overhang: 1.1
  wheel_tread: 1.64
  side_overhang: 0.128
  length: 4.89
  width: 1.896
  base_link: 뒷바퀴 축 가운데
  door:  # 가정: 문은 오른쪽 옆면, 앞뒤로 차 길이 가운데(EZ10 같은 가운데 문)
    x_from_base_link: 1.345  # (앞끝 3.79 + 뒤끝 -1.1) / 2
    y_from_base_link: -0.948  # 오른쪽 옆면 = -(wheel_tread/2 + side_overhang)
    width_assumed: 1.2  # 문 폭 가정. 문 구역 앞뒤 길이에만 쓴다
  carla_prius_note: 'CARLA 프리우스 4.514 x 2.007, 뒷축->차 중심 1.399m(세션38·41). 문 앞뒤 차 0.054m'
