# 충북대 캠퍼스 맵 v3 정류장과 차고지 후보다
# 맵은 maps/cbnu_campus_frozen_v3.xodr 이다(sha256 앞 16자 a17ab012e04c664f)
# 정류장마다 승강장(platforms)을 둔다. 양방향 길 위 정류장은 건너편에도 승강장이 있다. 도서관 북문은 막다른 끝이라 하나다
# 건너편 승강장은 같은 자리 옆 15m 안 반대 방향 차로 중 가장 가까운 곳이다. 도서관 남문만 보행로와 겹치는 차로를 피해 같은 길 반대쪽을 골랐다
# road/s/lane 은 OpenDRIVE 좌표다. lane -1 은 진행 방향 오른쪽 주행 차선이다
# 위경도는 WGS84 다. xodr 머리말의 투영과 offset 으로 역산했다(s22_buildings.Frame). CARLA GNSS 값과는 다르다
# direction 은 진행 방위(북 0, 동 90)를 8방위로 적은 것이다
# stop_zone_length_m 는 아직 정하지 않아 비워 두었다
# 데이터 출처는 OpenStreetMap 이다. (c) OpenStreetMap contributors, ODbL 1.0
# 좌표는 OSM 파생 지도와 OSM 노드에서 계산했다
